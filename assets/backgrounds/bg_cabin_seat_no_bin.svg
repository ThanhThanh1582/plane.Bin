<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cabinWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#E1F5FE"/>
    </linearGradient>
    <linearGradient id="seatFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="seatCushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="carpetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1. VÁCH KHOANG MÁY BAY -->
  <rect width="1000" height="460" fill="url(#cabinWall)"/>
  
  <!-- Sàn khoang trải thảm xanh đậm -->
  <rect y="460" width="1000" height="140" fill="url(#carpetGrad)"/>
  <line x1="0" y1="460" x2="1000" y2="460" stroke="#263238" stroke-width="4"/>

  <!-- Bảng thông báo hiệu lệnh trên trần (Đèn cài dây an toàn) -->
  <g transform="translate(420, 20)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#263238" stroke="#37474F" stroke-width="2"/>
    <text x="80" y="26" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFD54F" text-anchor="middle" letter-spacing="1">FASTEN SEATBELT 🔒</text>
  </g>

  <!-- 2. CỬA SỔ MÁY BAY BẦU DỤC (BÊN TRÁI) -->
  <g transform="translate(100, 80)" filter="url(#shadow)">
    <!-- Viền ngoài cửa sổ máy bay dày dặn -->
    <rect x="0" y="0" width="180" height="260" rx="90" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="12"/>
    <!-- Kính cửa sổ nhìn ra mây trời -->
    <rect x="12" y="12" width="156" height="236" rx="78" fill="url(#skyGrad)"/>
    <!-- Đám mây trắng bồng bềnh bên ngoài -->
    <ellipse cx="60" cy="140" rx="45" ry="25" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="100" cy="130" rx="40" ry="22" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="125" cy="155" rx="35" ry="20" fill="#FFFFFF" opacity="0.95"/>
    <!-- Cánh máy bay nhỏ xa xa -->
    <polygon points="120,180 156,165 156,190" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="150" cy="175" r="4" fill="#E53935"/>
  </g>

  <!-- 3. GHẾ NGỒI HÀNH KHÁCH MÁY BAY (VỊ TRÍ BÉ BIN NGỒI) -->
  <g transform="translate(360, 60)" filter="url(#shadow)">
    <!-- Tựa đầu ghế bọc vải trắng sạch sẽ -->
    <rect x="40" y="10" width="200" height="70" rx="18" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="4"/>
    <line x1="60" y1="50" x2="220" y2="50" stroke="#ECEFF1" stroke-width="3"/>

    <!-- Lưng ghế máy bay êm ái -->
    <rect x="25" y="70" width="230" height="280" rx="28" fill="url(#seatFabric)" stroke="#0D47A1" stroke-width="6"/>
    <!-- Rãnh may đệm lưng -->
    <line x1="60" y1="120" x2="220" y2="120" stroke="#42A5F5" stroke-width="3" opacity="0.6"/>
    <line x1="60" y1="200" x2="220" y2="200" stroke="#42A5F5" stroke-width="3" opacity="0.6"/>
    <line x1="60" y1="280" x2="220" y2="280" stroke="#42A5F5" stroke-width="3" opacity="0.6"/>

    <!-- Đệm ngồi của ghế -->
    <rect x="10" y="330" width="260" height="90" rx="20" fill="url(#seatCushion)" stroke="#0D47A1" stroke-width="5"/>

    <!-- Tay vịn ghế hai bên mạ chrome sang trọng -->
    <rect x="-10" y="240" width="26" height="150" rx="13" fill="#ECEFF1" stroke="#90A4AE" stroke-width="4"/>
    <rect x="264" y="240" width="26" height="150" rx="13" fill="#ECEFF1" stroke="#90A4AE" stroke-width="4"/>
    <!-- Miếng lót tay bọc da xanh -->
    <rect x="-8" y="242" width="22" height="60" rx="10" fill="#0D47A1"/>
    <rect x="266" y="242" width="22" height="60" rx="10" fill="#0D47A1"/>

    <!-- Chân đế kim loại ghế bắt sàn -->
    <rect x="50" y="415" width="24" height="65" fill="#78909C" stroke="#37474F" stroke-width="3"/>
    <rect x="206" y="415" width="24" height="65" fill="#78909C" stroke="#37474F" stroke-width="3"/>
  </g>

  <!-- Ghế hành khách bên phải (tạo chiều sâu khoang máy bay) -->
  <g transform="translate(730, 80)" filter="url(#shadow)" opacity="0.85">
    <rect x="25" y="60" width="200" height="270" rx="24" fill="#1565C0" stroke="#0D47A1" stroke-width="4"/>
    <rect x="10" y="320" width="230" height="80" rx="18" fill="#1E88E5" stroke="#0D47A1" stroke-width="4"/>
    <rect x="-6" y="230" width="22" height="140" rx="11" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
  </g>
</svg>
