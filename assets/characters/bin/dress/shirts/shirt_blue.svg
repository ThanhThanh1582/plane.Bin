<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="blueShirtL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
  </defs>

  <!-- Áo Thun Xanh In Máy Bay (Layer Trong Suốt) -->
  <g id="layer-shirt-blue">
    <!-- Thân áo thun -->
    <rect x="110" y="220" width="180" height="155" rx="36" fill="url(#blueShirtL)" stroke="#01579B" stroke-width="5"/>
    <path d="M 155 220 Q 200 245 245 220" stroke="#01579B" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Hình in máy bay giấy trắng trước ngực -->
    <g transform="translate(165, 260) scale(1.4)">
      <polygon points="0,20 40,5 20,35 15,22" fill="#FFFFFF"/>
      <polygon points="15,22 40,5 20,35" fill="#E1F5FE"/>
      <line x1="0" y1="20" x2="40" y2="5" stroke="#0288D1" stroke-width="2"/>
    </g>

    <!-- Ống tay áo thun -->
    <rect x="70" y="240" width="44" height="90" rx="22" transform="rotate(15 70 240)" fill="url(#blueShirtL)" stroke="#01579B" stroke-width="4"/>
    <rect x="285" y="240" width="44" height="90" rx="22" transform="rotate(-15 285 240)" fill="url(#blueShirtL)" stroke="#01579B" stroke-width="4"/>
  </g>
</svg>
