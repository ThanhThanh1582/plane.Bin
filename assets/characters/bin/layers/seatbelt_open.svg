<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <!-- Dây An Toàn Chưa Cài (Mở sang 2 bên hông) -->
  <g id="layer-seatbelt-open">
    <!-- Dây bên trái buông lỏng -->
    <path d="M 60 380 Q 80 430 100 450" stroke="#37474F" stroke-width="26" stroke-linecap="round" fill="none"/>
    <rect x="90" y="440" width="24" height="32" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="3" transform="rotate(25 90 440)"/>

    <!-- Dây bên phải buông lỏng -->
    <path d="M 340 380 Q 320 430 300 450" stroke="#37474F" stroke-width="26" stroke-linecap="round" fill="none"/>
    <rect x="285" y="440" width="28" height="42" rx="6" fill="#90A4AE" stroke="#546E7A" stroke-width="3" transform="rotate(-25 285 440)"/>
  </g>
</svg>
