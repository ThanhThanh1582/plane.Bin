<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skinGradP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="shirtGradP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FDD835"/>
    </linearGradient>
    <filter id="toyShadowP" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#toyShadowP)">
    <rect x="135" y="440" width="40" height="70" rx="20" fill="url(#skinGradP)"/>
    <rect x="225" y="440" width="40" height="70" rx="20" fill="url(#skinGradP)"/>
    <ellipse cx="145" cy="540" rx="36" ry="18" fill="#0288D1"/>
    <ellipse cx="255" cy="540" rx="36" ry="18" fill="#0288D1"/>

    <path d="M 120 360 L 280 360 L 270 450 L 210 450 L 200 400 L 190 450 L 130 450 Z" fill="#42A5F5" stroke="#1976D2" stroke-width="4"/>
    <path d="M 110 220 L 290 220 L 295 375 L 105 375 Z" fill="url(#shirtGradP)" stroke="#F57F17" stroke-width="5" rx="20"/>

    <!-- Tay phải chỉ sang hướng phải -->
    <rect x="270" y="240" width="100" height="36" rx="16" transform="rotate(-15 270 240)" fill="url(#skinGradP)" stroke="#FFA726" stroke-width="3"/>
    <circle cx="365" cy="225" r="18" fill="url(#skinGradP)"/>
    <!-- Tay trái thả lỏng -->
    <rect x="70" y="240" width="45" height="110" rx="22" transform="rotate(15 70 240)" fill="url(#skinGradP)" stroke="#FFA726" stroke-width="3"/>

    <!-- Đầu -->
    <circle cx="200" cy="130" r="85" fill="url(#skinGradP)" stroke="#FFA726" stroke-width="4"/>
    <path d="M 115 110 C 115 40, 285 40, 285 110 C 275 85, 230 75, 200 90 C 170 75, 125 85, 115 110 Z" fill="#212121"/>
    <path d="M 200 45 Q 215 25 210 20 Q 200 25 200 45" fill="#212121"/>
    <circle cx="165" cy="125" r="10" fill="#212121"/>
    <circle cx="235" cy="125" r="10" fill="#212121"/>
    <circle cx="145" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="255" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M 180 145 Q 200 170 220 145" stroke="#BF360C" stroke-width="5" stroke-linecap="round" fill="#D32F2F"/>
  </g>
</svg>
