<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skinSN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
  </defs>

  <g id="pose-sitting-neat">
    <!-- Đùi thu gọn sát nhau -->
    <rect x="145" y="380" width="50" height="90" rx="18" fill="var(--bin-pants-color, #1E88E5)"/>
    <rect x="205" y="380" width="50" height="90" rx="18" fill="var(--bin-pants-color, #1E88E5)"/>
    
    <!-- Cẳng chân thẳng tắp thu gọn ngay ngắn -->
    <rect x="152" y="440" width="34" height="65" rx="17" fill="url(#skinSN)"/>
    <rect x="214" y="440" width="34" height="65" rx="17" fill="url(#skinSN)"/>
    
    <!-- Đôi giày xếp sát nhau ngay ngắn -->
    <ellipse cx="165" cy="505" rx="26" ry="16" fill="var(--bin-shoes-color, #1976D2)"/>
    <ellipse cx="235" cy="505" rx="26" ry="16" fill="var(--bin-shoes-color, #1976D2)"/>

    <!-- Thân áo ngồi thẳng lưng -->
    <rect x="110" y="230" width="180" height="170" rx="36" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="4"/>

    <!-- 2 tay khoanh gọn trên đùi lịch sự -->
    <rect x="90" y="250" width="40" height="110" rx="20" transform="rotate(22 90 250)" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="3"/>
    <rect x="270" y="250" width="40" height="110" rx="20" transform="rotate(-22 270 250)" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="3"/>
    <circle cx="170" cy="365" r="16" fill="url(#skinSN)"/>
    <circle cx="230" cy="365" r="16" fill="url(#skinSN)"/>

    <!-- Đầu & Mặt Bé Bin -->
    <circle cx="200" cy="135" r="85" fill="url(#skinSN)" stroke="#FFA726" stroke-width="4"/>
    <circle cx="115" cy="140" r="18" fill="url(#skinSN)"/>
    <circle cx="285" cy="140" r="18" fill="url(#skinSN)"/>
    
    <!-- Tóc nâu đen -->
    <path d="M 115 115 C 115 45, 285 45, 285 115 C 275 90, 230 80, 200 95 C 170 80, 125 90, 115 115 Z" fill="#3E2723"/>
    <path d="M 195 55 Q 210 25 225 40 Q 215 55 205 60 Z" fill="#3E2723"/>
    
    <!-- Mắt cười tươi vui vẻ -->
    <circle cx="165" cy="130" r="10" fill="#212121"/>
    <circle cx="162" cy="127" r="3" fill="#FFFFFF"/>
    <circle cx="235" cy="130" r="10" fill="#212121"/>
    <circle cx="232" cy="127" r="3" fill="#FFFFFF"/>

    <circle cx="145" cy="150" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="255" cy="150" r="14" fill="#FF8A80" opacity="0.6"/>

    <!-- Nụ cười tự hào vì ngồi ngoan -->
    <path d="M 180 150 Q 200 175 220 150" stroke="#BF360C" stroke-width="5" stroke-linecap="round" fill="#D32F2F"/>
  </g>
</svg>
