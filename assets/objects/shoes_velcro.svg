<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="velcroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="shoeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#shoeShadow)">
    <!-- Giày trái -->
    <g transform="translate(30, 70)">
      <!-- Thân giày -->
      <path d="M 20 90 Q 30 20 80 30 Q 110 50 110 90 Z" fill="url(#velcroGrad)" stroke="#0D47A1" stroke-width="4"/>
      <!-- Miếng dán xé Velcro tiện lợi -->
      <rect x="35" y="38" width="55" height="24" rx="8" fill="#64B5F6" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Đế giày êm ái -->
      <path d="M 15 90 L 115 90 Q 115 110 65 110 Q 15 110 15 90 Z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
    </g>

    <!-- Giày phải -->
    <g transform="translate(145, 70)">
      <!-- Thân giày -->
      <path d="M 20 90 Q 30 20 80 30 Q 110 50 110 90 Z" fill="url(#velcroGrad)" stroke="#0D47A1" stroke-width="4"/>
      <!-- Miếng dán xé Velcro -->
      <rect x="35" y="38" width="55" height="24" rx="8" fill="#64B5F6" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Đế giày êm ái -->
      <path d="M 15 90 L 115 90 Q 115 110 65 110 Q 15 110 15 90 Z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
    </g>
  </g>
</svg>
