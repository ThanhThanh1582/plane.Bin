<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="softPantsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <filter id="softPantsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softPantsShadow)">
    <!-- Quần short thun co giãn êm ái -->
    <path d="M 65 60 L 235 60 L 225 240 L 160 240 L 150 170 L 140 240 L 75 240 Z" fill="url(#softPantsGrad)" stroke="#01579B" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Cạp chun co giãn mềm mại -->
    <rect x="62" y="55" width="176" height="28" rx="8" fill="#81D4FA" stroke="#0288D1" stroke-width="4"/>
    <line x1="80" y1="58" x2="80" y2="80" stroke="#0288D1" stroke-width="3"/>
    <line x1="110" y1="58" x2="110" y2="80" stroke="#0288D1" stroke-width="3"/>
    <line x1="190" y1="58" x2="190" y2="80" stroke="#0288D1" stroke-width="3"/>
    <line x1="220" y1="58" x2="220" y2="80" stroke="#0288D1" stroke-width="3"/>

    <!-- Dây buộc nơ trắng dễ thương -->
    <path d="M 140 70 Q 150 95 140 115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 160 70 Q 150 95 160 115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="72" r="5" fill="#FFFFFF"/>
  </g>
</svg>
