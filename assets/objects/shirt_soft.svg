<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tshirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <filter id="softItemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softItemShadow)">
    <!-- Thân áo thun mềm mại -->
    <path d="M 90 60 L 50 110 L 80 130 L 95 105 L 95 240 L 205 240 L 205 105 L 220 130 L 250 110 L 210 60 C 180 85 120 85 90 60 Z" fill="url(#tshirtGrad)" stroke="#F57F17" stroke-width="6" stroke-linejoin="round"/>
    <!-- Cổ áo tròn co giãn -->
    <path d="M 115 68 Q 150 95 185 68" stroke="#F57F17" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Hình in máy bay xanh ngộ nghĩnh trước ngực -->
    <g transform="translate(110, 120)">
      <ellipse cx="40" cy="25" rx="35" ry="12" fill="#29B6F6"/>
      <polygon points="35,15 50,0 60,15" fill="#0288D1"/>
      <polygon points="35,35 50,50 60,35" fill="#0288D1"/>
      <circle cx="20" cy="25" r="4" fill="#FFFFFF"/>
      <circle cx="35" cy="25" r="4" fill="#FFFFFF"/>
      <circle cx="50" cy="25" r="4" fill="#FFFFFF"/>
      <ellipse cx="75" cy="25" rx="4" ry="14" fill="#FF5252"/>
    </g>
  </g>
</svg>
