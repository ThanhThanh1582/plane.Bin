<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Nắp bình -->
    <rect x="130" y="45" width="40" height="25" rx="6" fill="#37474F"/>
    <rect x="120" y="70" width="60" height="15" rx="4" fill="#78909C"/>
    <!-- Thân bình nước lớn 500ml -->
    <rect x="105" y="85" width="90" height="160" rx="20" fill="url(#bottleGrad)" stroke="#01579B" stroke-width="5"/>
    <rect x="115" y="105" width="70" height="120" rx="10" fill="#E1F5FE" opacity="0.4"/>
    <!-- Vạch dung tích -->
    <line x1="125" y1="130" x2="145" y2="130" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="125" y1="150" x2="155" y2="150" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="125" y1="170" x2="145" y2="170" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Nhãn dung tích 500ml -->
    <text x="150" y="200" font-size="14" font-weight="900" fill="#01579B" text-anchor="middle">>100ml</text>
  </g>
</svg>
