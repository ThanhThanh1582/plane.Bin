<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Tay kéo -->
    <rect x="150" y="20" width="100" height="70" rx="14" fill="none" stroke="#78909C" stroke-width="12"/>
    <rect x="140" y="20" width="120" height="18" rx="9" fill="#37474F"/>
    <!-- Thân vali đỏ -->
    <rect x="60" y="80" width="280" height="360" rx="40" fill="url(#caseGrad)" stroke="#B71C1C" stroke-width="8"/>
    <!-- Đường viền nổi & gân vali -->
    <rect x="85" y="105" width="230" height="310" rx="28" fill="none" stroke="#FF8A80" stroke-width="4"/>
    <line x1="200" y1="80" x2="200" y2="440" stroke="#B71C1C" stroke-width="4"/>
    <!-- Khóa kéo kim loại & Quai xách -->
    <rect x="160" y="70" width="80" height="20" rx="10" fill="#B71C1C"/>
    <!-- Bánh xe xoay 360 -->
    <circle cx="100" cy="445" r="18" fill="#37474F" stroke="#212121" stroke-width="4"/>
    <circle cx="100" cy="445" r="7" fill="#CFD8DC"/>
    <circle cx="300" cy="445" r="18" fill="#37474F" stroke="#212121" stroke-width="4"/>
    <circle cx="300" cy="445" r="7" fill="#CFD8DC"/>
  </g>
</svg>
