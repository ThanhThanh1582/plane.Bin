<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gateHall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="gateFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#607D8B"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <linearGradient id="skinGradG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <filter id="gateGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E676" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Bối cảnh sảnh kiểm tra an ninh -->
  <rect width="800" height="320" fill="url(#gateHall)"/>
  <rect y="320" width="800" height="130" fill="#90A4AE"/>
  <line x1="0" y1="365" x2="800" y2="365" stroke="#78909C" stroke-width="2"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#78909C" stroke-width="2"/>

  <!-- Vạch kẻ hướng dẫn bước chân màu vàng an toàn trên sàn -->
  <rect x="360" y="335" width="80" height="15" rx="4" fill="#FFD54F"/>
  <rect x="360" y="375" width="80" height="15" rx="4" fill="#FFD54F"/>

  <!-- Cổng từ an ninh lớn ở vị trí trung tâm -->
  <rect x="290" y="50" width="220" height="340" rx="16" fill="none" stroke="url(#gateFrame)" stroke-width="28"/>
  <line x1="280" y1="390" x2="520" y2="390" stroke="#263238" stroke-width="12" stroke-linecap="round"/>

  <!-- Đèn báo tín hiệu màu xanh trên đỉnh cổng -->
  <g filter="url(#gateGlow)">
    <rect x="350" y="35" width="100" height="30" rx="8" fill="#00E676" stroke="#1B5E20" stroke-width="3"/>
    <circle cx="375" cy="50" r="6" fill="#FFFFFF"/>
    <circle cx="400" cy="50" r="6" fill="#FFFFFF"/>
    <circle cx="425" cy="50" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Chú công an an ninh đứng bên phải chào đón -->
  <g transform="translate(560, 110)">
    <!-- Quần tây xanh navy -->
    <rect x="40" y="170" width="22" height="95" fill="#1A237E"/>
    <rect x="68" y="170" width="22" height="95" fill="#1A237E"/>
    <ellipse cx="50" cy="265" rx="16" ry="8" fill="#212121"/>
    <ellipse cx="80" cy="265" rx="16" ry="8" fill="#212121"/>
    <!-- Áo sơ mi xanh dương nhạt đồng phục an ninh hàng không -->
    <rect x="30" y="80" width="70" height="95" rx="14" fill="#81D4FA" stroke="#0288D1" stroke-width="3"/>
    <polygon points="55,90 65,90 70,160 60,165 50,160" fill="#1A237E"/>
    <!-- Tay giơ chào đón thân thiện -->
    <path d="M 30 100 Q 5 130 15 150" stroke="#81D4FA" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="15" cy="150" r="9" fill="url(#skinGradG)"/>
    <!-- Mặt & Mũ an ninh -->
    <circle cx="65" cy="45" r="32" fill="url(#skinGradG)"/>
    <circle cx="55" cy="42" r="4" fill="#212121"/>
    <circle cx="75" cy="42" r="4" fill="#212121"/>
    <path d="M 58 58 Q 65 68 72 58" stroke="#D84315" stroke-width="2" fill="none"/>
    <!-- Mũ kepi an ninh -->
    <ellipse cx="65" cy="22" rx="36" ry="12" fill="#1A237E"/>
    <circle cx="65" cy="16" r="6" fill="#FFD54F"/>
  </g>

  <!-- Bé Bin tự tin tươi cười bước qua cổng ở giữa -->
  <g transform="translate(335, 130)">
    <!-- Đôi chân & Giày dán xé bước đi -->
    <rect x="40" y="180" width="22" height="55" rx="10" transform="rotate(-10 40 180)" fill="url(#skinGradG)"/>
    <rect x="75" y="180" width="22" height="55" rx="10" transform="rotate(15 75 180)" fill="url(#skinGradG)"/>
    <ellipse cx="32" cy="235" rx="18" ry="10" fill="#0288D1"/>
    <ellipse cx="92" cy="235" rx="18" ry="10" fill="#0288D1"/>

    <!-- Quần short thun xanh -->
    <path d="M 35 140 L 105 140 L 100 190 L 72 190 L 70 165 L 68 190 L 40 190 Z" fill="#42A5F5" stroke="#1976D2" stroke-width="3"/>

    <!-- Áo thun vàng máy bay -->
    <rect x="35" y="75" width="70" height="70" rx="16" fill="#FDD835" stroke="#F57F17" stroke-width="4"/>
    <polygon points="60,110 72,100 78,112 68,110" fill="#FFFFFF"/>

    <!-- Hai cánh tay vẫy chào vui vẻ -->
    <path d="M 35 90 Q 15 110 20 130" stroke="#FDD835" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="130" r="8" fill="url(#skinGradG)"/>
    
    <path d="M 105 90 Q 125 110 120 130" stroke="#FDD835" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="130" r="8" fill="url(#skinGradG)"/>

    <!-- Đầu & khuôn mặt Bé Bin -->
    <circle cx="70" cy="38" r="38" fill="url(#skinGradG)" stroke="#FFA726" stroke-width="3"/>
    <circle cx="32" cy="40" r="8" fill="url(#skinGradG)"/>
    <circle cx="108" cy="40" r="8" fill="url(#skinGradG)"/>

    <!-- Tóc đen tròn ngộ nghĩnh có chỏm tóc -->
    <path d="M 32 30 C 32 -2, 108 -2, 108 30 C 100 18, 80 14, 70 20 C 60 14, 40 18, 32 30 Z" fill="#212121"/>
    <path d="M 70 2 Q 76 -6 74 -8 Q 68 -6 70 2" fill="#212121"/>

    <!-- Mắt, má hồng, nụ cười -->
    <circle cx="55" cy="35" r="5" fill="#212121"/>
    <circle cx="53" cy="33" r="2" fill="#FFFFFF"/>
    <circle cx="85" cy="35" r="5" fill="#212121"/>
    <circle cx="83" cy="33" r="2" fill="#FFFFFF"/>
    <circle cx="47" cy="45" r="7" fill="#FF8A80" opacity="0.6"/>
    <circle cx="93" cy="45" r="7" fill="#FF8A80" opacity="0.6"/>
    <path d="M 62 46 Q 70 56 78 46" stroke="#BF360C" stroke-width="3" stroke-linecap="round" fill="#D32F2F"/>
  </g>

  <!-- Ba Mẹ đứng phía sau mỉm cười theo dõi -->
  <g transform="translate(130, 130) opacity(0.85)">
    <!-- Mẹ -->
    <ellipse cx="60" cy="180" rx="20" ry="60" fill="#FF8A80"/>
    <circle cx="60" cy="90" r="24" fill="url(#skinGradG)"/>
    <path d="M 36 85 C 36 50, 84 50, 84 85 C 84 110, 36 110, 36 85 Z" fill="#4E342E"/>
  </g>
</svg>
