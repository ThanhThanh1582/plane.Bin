<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cabinWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>
    <linearGradient id="seatBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cabinWall)"/>

  <!-- Cửa sổ máy bay hình bầu dục nhìn ra mây trắng -->
  <rect x="580" y="80" width="140" height="220" rx="70" fill="#81D4FA" stroke="#FFFFFF" stroke-width="12"/>
  <ellipse cx="640" cy="180" rx="35" ry="20" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="670" cy="200" rx="40" ry="25" fill="#FFFFFF" opacity="0.9"/>

  <!-- Ghế máy bay màu xanh êm ái -->
  <rect x="220" y="100" width="360" height="320" rx="40" fill="url(#seatBlue)" stroke="#013A6B" stroke-width="6"/>
  <!-- Tựa đầu ghế trắng -->
  <rect x="300" y="85" width="200" height="50" rx="14" fill="#FFFFFF"/>

  <!-- Bé Bin ngồi trong ghế máy bay (Dây an toàn chưa cài) -->
  <g transform="translate(290, 100) scale(0.55)">
    <!-- Đầu Bin -->
    <circle cx="200" cy="130" r="85" fill="#FFE0B2" stroke="#FFA726" stroke-width="4"/>
    <path d="M 115 110 C 115 40, 285 40, 285 110 C 275 85, 230 75, 200 90 C 170 75, 125 85, 115 110 Z" fill="#212121"/>
    <path d="M 200 45 Q 215 25 210 20 Q 200 25 200 45" fill="#212121"/>
    <circle cx="165" cy="125" r="10" fill="#212121"/>
    <circle cx="235" cy="125" r="10" fill="#212121"/>
    <circle cx="145" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="255" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M 180 145 Q 200 170 220 145" stroke="#BF360C" stroke-width="5" stroke-linecap="round" fill="#D32F2F"/>
    <!-- Thân áo vàng -->
    <path d="M 110 220 L 290 220 L 295 375 L 105 375 Z" fill="#FDD835" stroke="#F57F17" stroke-width="5" rx="20"/>
    <path d="M 120 360 L 280 360 L 270 450 L 210 450 L 200 400 L 190 450 L 130 450 Z" fill="#42A5F5" stroke="#1976D2" stroke-width="4"/>
    <!-- Hai tay cầm 2 đầu khóa dây an toàn mở -->
    <rect x="70" y="320" width="60" height="16" rx="8" fill="#37474F"/>
    <rect x="270" y="320" width="60" height="16" rx="8" fill="#37474F"/>
    <rect x="60" y="315" width="20" height="26" rx="4" fill="#B0BEC5"/>
    <rect x="320" y="315" width="20" height="26" rx="4" fill="#B0BEC5"/>
  </g>
</svg>
