<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="60%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="woodFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="wardrobeWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="wardrobeInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4D2"/>
      <stop offset="100%" stop-color="#FCD0B4"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1B18"/>
    </linearGradient>
    <linearGradient id="rugGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80CBC4"/>
      <stop offset="100%" stop-color="#4DB6AC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3E2723" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 1. TƯỜNG PHÒNG NGỦ ẤM ÁP -->
  <rect width="1000" height="420" fill="url(#wallGrad)"/>
  
  <!-- Cửa sổ phòng ngủ nhìn ra trời mây trong xanh -->
  <g transform="translate(680, 50)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="230" rx="20" fill="#E1F5FE" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="110" y1="0" x2="110" y2="230" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="0" y1="115" x2="220" y2="115" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Mây ngoài trời & Mặt trời vàng dịu -->
    <circle cx="170" cy="50" r="30" fill="#FFF59D"/>
    <ellipse cx="60" cy="80" rx="35" ry="20" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="90" cy="70" rx="30" ry="18" fill="#FFFFFF" opacity="0.95"/>
    <!-- Rèm cửa cam pastel -->
    <path d="M -15 -10 Q 15 100 -10 220 L -25 220 Z" fill="#FFAB91"/>
    <path d="M 235 -10 Q 205 100 230 220 L 245 220 Z" fill="#FFAB91"/>
  </g>

  <!-- Bức tranh treo tường máy bay du lịch -->
  <g transform="translate(480, 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="95" rx="10" fill="#FFFFFF" stroke="#FFB74D" stroke-width="6"/>
    <rect x="8" y="8" width="114" height="79" rx="4" fill="#E0F7FA"/>
    <polygon points="30,60 75,30 90,65 55,60" fill="#0288D1"/>
    <line x1="75" y1="30" x2="55" y2="60" stroke="#01579B" stroke-width="2"/>
    <!-- Đám mây nhỏ trong tranh -->
    <ellipse cx="40" cy="35" rx="15" ry="8" fill="#FFFFFF"/>
  </g>

  <!-- 2. SÀN GỖ SỒI & THẢM LEN ÊM ÁI -->
  <rect y="420" width="1000" height="180" fill="url(#woodFloor)"/>
  <!-- Vân sàn gỗ -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#6D4C41" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="540" x2="1000" y2="540" stroke="#6D4C41" stroke-width="3" opacity="0.5"/>
  <line x1="250" y1="420" x2="250" y2="480" stroke="#6D4C41" stroke-width="3" opacity="0.5"/>
  <line x1="580" y1="480" x2="580" y2="540" stroke="#6D4C41" stroke-width="3" opacity="0.5"/>
  <line x1="820" y1="420" x2="820" y2="480" stroke="#6D4C41" stroke-width="3" opacity="0.5"/>

  <!-- Thảm len tròn màu ngọc bích dưới chân Bé Bin -->
  <ellipse cx="620" cy="515" rx="240" ry="60" fill="url(#rugGrad)" filter="url(#shadow)"/>
  <ellipse cx="620" cy="515" rx="210" ry="48" fill="#E0F2F1" opacity="0.6"/>

  <!-- 3. TỦ QUẦN ÁO MỞ CÁNH (WARDROBE) -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Thân tủ gỗ sồi lớn -->
    <rect x="0" y="0" width="340" height="460" rx="22" fill="url(#wardrobeWood)" stroke="#BF360C" stroke-width="6"/>
    <!-- Lòng trong tủ gỗ màu kem sáng -->
    <rect x="20" y="20" width="300" height="340" rx="14" fill="url(#wardrobeInner)" stroke="#FFA726" stroke-width="4"/>
    
    <!-- Thanh treo quần áo bằng gỗ -->
    <rect x="35" y="60" width="270" height="12" rx="6" fill="#8D6E63"/>

    <!-- Móc treo 1: Áo thun vàng in hình máy bay -->
    <g transform="translate(60, 65)">
      <path d="M 25 0 Q 25 -18 35 -18 Q 45 -18 45 -5" stroke="#78909C" stroke-width="4" fill="none"/>
      <path d="M 5 15 L 75 15 L 68 95 L 12 95 Z" fill="#FDD835" stroke="#F57F17" stroke-width="4" rx="8"/>
      <!-- Máy bay giấy in trên áo -->
      <polygon points="30,55 52,40 60,60 42,55" fill="none" stroke="#F57F17" stroke-width="3"/>
    </g>

    <!-- Móc treo 2: Quần thun xanh co giãn -->
    <g transform="translate(145, 65)">
      <path d="M 25 0 Q 25 -18 35 -18 Q 45 -18 45 -5" stroke="#78909C" stroke-width="4" fill="none"/>
      <path d="M 10 15 L 65 15 L 60 100 L 42 100 L 38 50 L 34 100 L 16 100 Z" fill="#4FC3F7" stroke="#0288D1" stroke-width="4"/>
    </g>

    <!-- Móc treo 3: Áo khoác pastel -->
    <g transform="translate(225, 65)">
      <path d="M 25 0 Q 25 -18 35 -18 Q 45 -18 45 -5" stroke="#78909C" stroke-width="4" fill="none"/>
      <path d="M 5 15 L 75 15 L 70 95 L 10 95 Z" fill="#81C784" stroke="#388E3C" stroke-width="4" rx="8"/>
    </g>

    <!-- Kệ để giày & đồ dùng dưới -->
    <rect x="35" y="230" width="270" height="10" rx="4" fill="#FFA726"/>
    <!-- Đôi giày thể thao dán xé trên kệ -->
    <g transform="translate(70, 240)">
      <rect x="0" y="20" width="45" height="24" rx="8" fill="#0288D1" stroke="#01579B" stroke-width="3"/>
      <rect x="10" y="10" width="25" height="8" rx="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(130, 240)">
      <rect x="0" y="20" width="45" height="24" rx="8" fill="#0288D1" stroke="#01579B" stroke-width="3"/>
      <rect x="10" y="10" width="25" height="8" rx="3" fill="#FFFFFF"/>
    </g>

    <!-- Hộp đựng đồ xinh xắn -->
    <rect x="200" y="250" width="80" height="35" rx="6" fill="#FFF59D" stroke="#FBC02D" stroke-width="3"/>

    <!-- Ngăn kéo tủ lớn bên dưới -->
    <rect x="20" y="375" width="300" height="65" rx="12" fill="#FB8C00" stroke="#E65100" stroke-width="4"/>
    <circle cx="170" cy="407" r="9" fill="#FFE082" stroke="#E65100" stroke-width="3"/>

    <!-- Cánh tủ mở rộng sang trái tạo chiều sâu 3D -->
    <polygon points="0,0 -50,30 -50,430 0,460" fill="#F57C00" stroke="#BF360C" stroke-width="5"/>
  </g>

  <!-- 4. BÉ BIN ĐỨNG TRƯỚC TỦ ĐỒ (ĐÚNG 100% CHARACTER SHEET KHÓA CHUẨN) -->
  <g transform="translate(480, 110)" filter="url(#shadow)">
    <!-- Đôi chân & Đầu gối hồng hào -->
    <path d="M 105 340 L 105 405 Q 105 415 115 415 L 125 415 Q 135 415 135 405 L 135 340 Z" fill="url(#skin)"/>
    <path d="M 165 340 L 165 405 Q 165 415 175 415 L 185 415 Q 195 415 195 405 L 195 340 Z" fill="url(#skin)"/>
    <circle cx="120" cy="365" r="7" fill="#FF8A80" opacity="0.45"/>
    <circle cx="180" cy="365" r="7" fill="#FF8A80" opacity="0.45"/>

    <!-- Tất trắng mộc -->
    <ellipse cx="120" cy="410" rx="16" ry="9" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
    <ellipse cx="180" cy="410" rx="16" ry="9" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>

    <!-- Quần đùi lót mộc trắng -->
    <path d="M 85 270 L 215 270 L 205 340 L 165 340 L 150 305 L 135 340 L 95 340 Z" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="3"/>

    <!-- Áo ba lỗ lót trắng mộc -->
    <path d="M 85 185 Q 150 175 215 185 L 215 280 Q 150 290 85 280 Z" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="3"/>
    <path d="M 115 180 Q 150 215 185 180" stroke="#CFD8DC" stroke-width="3" fill="none"/>

    <!-- Cánh tay trái chạm cằm suy nghĩ -->
    <g transform="translate(45, 185)">
      <path d="M 45 10 Q 10 50 15 90 Q 25 105 38 95 Q 40 65 50 18 Z" fill="url(#skin)" stroke="#FFA726" stroke-width="2.5"/>
      <circle cx="22" cy="100" r="10" fill="url(#skin)"/>
      <!-- Bàn tay chạm lên cằm -->
      <circle cx="55" cy="55" r="8" fill="url(#skin)"/>
    </g>

    <!-- Cánh tay phải chống hông tự nhiên -->
    <g transform="translate(205, 185)">
      <path d="M 5 10 Q 30 50 25 90 Q 15 105 5 95 Q 0 65 0 18 Z" fill="url(#skin)" stroke="#FFA726" stroke-width="2.5"/>
      <circle cx="18" cy="98" r="10" fill="url(#skin)"/>
    </g>

    <!-- Cổ & Khuôn mặt Bé Bin bầu bĩnh đáng yêu -->
    <rect x="135" y="165" width="30" height="25" fill="url(#skin)"/>
    <ellipse cx="150" cy="115" rx="60" ry="54" fill="url(#skin)" stroke="#FFA726" stroke-width="3"/>

    <!-- Đôi tai tròn -->
    <circle cx="90" cy="118" r="14" fill="url(#skin)" stroke="#FFA726" stroke-width="2.5"/>
    <circle cx="90" cy="118" r="7" fill="#F8BBD0" opacity="0.6"/>
    <circle cx="210" cy="118" r="14" fill="url(#skin)" stroke="#FFA726" stroke-width="2.5"/>
    <circle cx="210" cy="118" r="7" fill="#F8BBD0" opacity="0.6"/>

    <!-- Mái tóc đen tròn có lọn tóc cong trên đỉnh (Ahoge) -->
    <path d="M 88 108 C 88 40, 212 40, 212 108 C 205 78, 185 65, 168 74 C 155 62, 138 62, 126 74 C 114 65, 96 78, 88 108 Z" fill="url(#hair)"/>
    <path d="M 166 50 Q 178 20 170 15 Q 158 25 160 50 Z" fill="url(#hair)"/>

    <!-- Đôi lông mày thanh tú mềm mại -->
    <path d="M 112 85 Q 125 80 134 87" stroke="#4E342E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 188 85 Q 175 80 166 87" stroke="#4E342E" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Đôi mắt to tròn long lanh đen láy -->
    <ellipse cx="124" cy="106" rx="8" ry="10" fill="#212121"/>
    <circle cx="121" cy="102" r="3" fill="#FFFFFF"/>
    <circle cx="126" cy="109" r="1.5" fill="#FFFFFF"/>

    <ellipse cx="176" cy="106" rx="8" ry="10" fill="#212121"/>
    <circle cx="173" cy="102" r="3" fill="#FFFFFF"/>
    <circle cx="178" cy="109" r="1.5" fill="#FFFFFF"/>

    <!-- Mũi nhỏ xinh -->
    <circle cx="150" cy="116" r="2.5" fill="#D84315"/>

    <!-- Má hồng watercolor chúm chím -->
    <ellipse cx="106" cy="122" rx="12" ry="8" fill="#FF8A80" opacity="0.65"/>
    <ellipse cx="194" cy="122" rx="12" ry="8" fill="#FF8A80" opacity="0.65"/>

    <!-- Nụ cười tươi tắn dễ thương -->
    <path d="M 136 128 Q 150 142 164 128" stroke="#BF360C" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Bong bóng suy nghĩ: Bé Bin đang suy nghĩ chọn quần áo -->
    <circle cx="215" cy="45" r="5" fill="#FFFFFF" stroke="#FFA726" stroke-width="2"/>
    <circle cx="230" cy="30" r="8" fill="#FFFFFF" stroke="#FFA726" stroke-width="2"/>
    <g transform="translate(240, -15)">
      <rect x="0" y="0" width="85" height="48" rx="14" fill="#FFFFFF" stroke="#FFA726" stroke-width="3"/>
      <text x="42" y="32" font-size="24" text-anchor="middle">👕❓</text>
    </g>
  </g>
</svg>
