<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hallWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8ECEF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="ticketBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#283593"/>
    </linearGradient>
    <filter id="ticketShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-4" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Bối cảnh sảnh sân bay & cửa kiểm tra vé -->
  <rect width="800" height="600" fill="url(#hallWall)"/>

  <!-- Hành lang cửa dẫn lên máy bay phía xa -->
  <rect x="260" y="0" width="280" height="420" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="4"/>
  <line x1="260" y1="0" x2="330" y2="180" stroke="#B0BEC5" stroke-width="3"/>
  <line x1="540" y1="0" x2="470" y2="180" stroke="#B0BEC5" stroke-width="3"/>
  <line x1="330" y1="180" x2="470" y2="180" stroke="#B0BEC5" stroke-width="3"/>
  <line x1="330" y1="180" x2="330" y2="420" stroke="#B0BEC5" stroke-width="3"/>
  <line x1="470" y1="180" x2="470" y2="420" stroke="#B0BEC5" stroke-width="3"/>

  <!-- Cửa sổ sân bay bên phải -->
  <rect x="680" y="40" width="120" height="380" fill="#E1F5FE" stroke="#B0BEC5" stroke-width="4"/>
  <rect x="710" y="80" width="60" height="40" fill="#81D4FA" opacity="0.5"/>
  <rect x="710" y="140" width="60" height="40" fill="#81D4FA" opacity="0.5"/>
  <rect x="710" y="200" width="60" height="40" fill="#81D4FA" opacity="0.5"/>

  <!-- Nhân viên hàng không nam bên trái quầy (Áo sơ mi trắng, cà vạt đỏ, mỉm cười chào) -->
  <g transform="translate(10, 0)">
    <!-- Quầy thủ tục -->
    <rect x="-10" y="450" width="220" height="150" fill="#90A4AE" stroke="#78909C" stroke-width="4"/>
    <rect x="-10" y="440" width="230" height="20" rx="6" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3"/>
    
    <!-- Thân người -->
    <path d="M 0 160 L 160 160 L 170 440 L -10 440 Z" fill="#FFFFFF"/>
    <!-- Cà vạt đỏ -->
    <polygon points="75,180 85,180 90,320 80,340 70,320" fill="#D32F2F"/>
    <rect x="75" y="220" width="10" height="4" fill="#FBC02D"/>
    <!-- Cổ áo -->
    <polygon points="50,160 80,185 60,185" fill="#ECEFF1"/>
    <polygon points="110,160 80,185 100,185" fill="#ECEFF1"/>

    <!-- Cánh tay chào đón hướng về phía lối đi -->
    <path d="M 140 220 Q 200 240 250 260 L 260 280 Q 200 280 130 260 Z" fill="#FFFFFF"/>
    <!-- Bàn tay chỉ đường -->
    <path d="M 250 260 Q 280 270 290 285 Q 275 300 255 285 Z" fill="#8D6E63"/>

    <!-- Đầu & khuôn mặt tươi cười -->
    <ellipse cx="80" cy="95" rx="42" ry="50" fill="#8D6E63"/>
    <!-- Tóc ngắn đen gọn gàng -->
    <path d="M 38 90 C 38 40, 122 40, 122 90 C 115 65, 80 60, 38 90 Z" fill="#212121"/>
    <!-- Mắt, tai, mũi, miệng -->
    <circle cx="40" cy="95" r="8" fill="#8D6E63"/>
    <circle cx="120" cy="95" r="8" fill="#8D6E63"/>
    <circle cx="65" cy="90" r="5" fill="#212121"/>
    <circle cx="95" cy="90" r="5" fill="#212121"/>
    <path d="M 68 115 Q 80 130 92 115" stroke="#4E342E" stroke-width="3" fill="#FFFFFF"/>
  </g>

  <!-- ==========================================================================
       VÉ MÁY BAY CHÍNH CỦA BÉ BIN (BOARDING PASS NẰM NGHIÊNG TRÊN TAY)
       ========================================================================== -->
  <g transform="translate(10, 80) rotate(-14 400 300)" filter="url(#ticketShadow)" id="boarding-ticket-card" style="cursor: pointer;">
    <!-- Thân vé máy bay chữ nhật bo góc lớn -->
    <rect x="120" y="140" width="620" height="340" rx="28" fill="#FFFFFF" stroke="#0D47A1" stroke-width="4"/>

    <!-- Dải sọc trang trí xanh dương & sọc đỏ/trắng trên đầu vé -->
    <path d="M 120 168 C 120 152 132 140 148 140 L 712 140 C 728 140 740 152 740 168 L 740 210 L 120 210 Z" fill="url(#ticketBlue)"/>
    
    <!-- Họa tiết sọc chéo đỏ/trắng thể thao trên mép vé -->
    <g transform="translate(260, 140)">
      <polygon points="0,0 20,0 10,70 -10,70" fill="#D32F2F"/>
      <polygon points="30,0 50,0 40,70 20,70" fill="#FFFFFF"/>
      <polygon points="60,0 80,0 70,70 50,70" fill="#D32F2F"/>
      <polygon points="90,0 110,0 100,70 80,70" fill="#FFFFFF"/>
      <polygon points="120,0 140,0 130,70 110,70" fill="#D32F2F"/>
      <polygon points="150,0 170,0 160,70 140,70" fill="#FFFFFF"/>
      <polygon points="280,0 300,0 290,70 270,70" fill="#D32F2F"/>
      <polygon points="310,0 330,0 320,70 300,70" fill="#FFFFFF"/>
      <polygon points="340,0 360,0 350,70 330,70" fill="#D32F2F"/>
      <polygon points="370,0 390,0 380,70 360,70" fill="#FFFFFF"/>
      <polygon points="400,0 420,0 410,70 390,70" fill="#D32F2F"/>
    </g>

    <!-- Khối sọc xanh đậm bên trái -->
    <path d="M 120 168 C 120 152 132 140 148 140 L 260 140 L 260 480 L 148 480 C 132 480 120 468 120 452 Z" fill="#1A237E"/>

    <!-- Biểu tượng máy bay trắng đang bay lên bên trái -->
    <g transform="translate(150, 180)">
      <path d="M 40 10 L 45 40 L 80 55 L 80 65 L 45 55 L 45 80 L 60 90 L 60 98 L 38 92 L 16 98 L 16 90 L 31 80 L 31 55 L -4 65 L -4 55 L 31 40 Z" fill="#FFFFFF"/>
      <!-- Vệt sóng khí động học -->
      <path d="M 20 85 Q 10 110 5 125" stroke="#81D4FA" stroke-width="3" fill="none"/>
      <path d="M 38 95 Q 38 120 38 135" stroke="#81D4FA" stroke-width="4" fill="none"/>
      <path d="M 56 85 Q 66 110 71 125" stroke="#81D4FA" stroke-width="3" fill="none"/>
    </g>

    <!-- Mã vạch Barcode an toàn hàng không bên cạnh trái -->
    <g transform="translate(150, 360)">
      <rect x="0" y="0" width="80" height="75" fill="#FFFFFF" rx="6"/>
      <!-- Các vạch đen -->
      <rect x="6" y="8" width="4" height="60" fill="#212121"/>
      <rect x="14" y="8" width="8" height="60" fill="#212121"/>
      <rect x="26" y="8" width="3" height="60" fill="#212121"/>
      <rect x="33" y="8" width="6" height="60" fill="#212121"/>
      <rect x="43" y="8" width="10" height="60" fill="#212121"/>
      <rect x="57" y="8" width="4" height="60" fill="#212121"/>
      <rect x="65" y="8" width="7" height="60" fill="#212121"/>
    </g>

    <!-- Hình mờ quả địa cầu to bên phải vé -->
    <g transform="translate(610, 320)" opacity="0.18">
      <circle cx="0" cy="0" r="95" fill="none" stroke="#0D47A1" stroke-width="6"/>
      <ellipse cx="0" cy="0" rx="95" ry="45" fill="none" stroke="#0D47A1" stroke-width="5"/>
      <ellipse cx="0" cy="0" rx="45" ry="95" fill="none" stroke="#0D47A1" stroke-width="5"/>
      <line x1="-95" y1="0" x2="95" y2="0" stroke="#0D47A1" stroke-width="5"/>
      <line x1="0" y1="-95" x2="0" y2="95" stroke="#0D47A1" stroke-width="5"/>
    </g>

    <!-- ==========================================================================
         CÁC DÒNG THÔNG TIN VÉ MÁY BAY IN RÕ RÀNG THEO MẪU
         ========================================================================== -->
    <g transform="translate(280, 225)">
      <!-- 1. Tên hãng hàng không -->
      <text x="0" y="24" font-size="16" font-weight="900" fill="#37474F">Tên hãng hàng không:</text>
      <text x="210" y="24" font-size="18" font-weight="900" fill="#0D47A1">VIETNAM AIRLINES ✈️</text>
      <line x1="200" y1="30" x2="440" y2="30" stroke="#B0BEC5" stroke-width="2"/>

      <!-- 2. Tên hành khách -->
      <text x="0" y="64" font-size="16" font-weight="900" fill="#37474F">Tên hành khách:</text>
      <text x="160" y="64" font-size="22" font-weight="900" fill="#E65100">BÉ BIN</text>
      <line x1="150" y1="70" x2="440" y2="70" stroke="#B0BEC5" stroke-width="2"/>

      <!-- 3. Nơi đi -->
      <text x="0" y="104" font-size="15" font-weight="900" fill="#37474F">Nơi đi:</text>
      <text x="75" y="104" font-size="17" font-weight="900" fill="#1B5E20">HÀ NỘI (HAN)</text>
      <line x1="65" y1="110" x2="220" y2="110" stroke="#B0BEC5" stroke-width="2"/>

      <!-- 4. Nơi đến -->
      <text x="0" y="144" font-size="15" font-weight="900" fill="#37474F">Nơi đến:</text>
      <text x="85" y="144" font-size="17" font-weight="900" fill="#1B5E20">ĐÀ NẴNG (DAD)</text>
      <line x1="75" y1="150" x2="220" y2="150" stroke="#B0BEC5" stroke-width="2"/>

      <!-- 5. Chuyến bay số & Số ghế -->
      <text x="0" y="184" font-size="15" font-weight="900" fill="#37474F">Chuyến bay số:</text>
      <text x="135" y="184" font-size="17" font-weight="900" fill="#0D47A1">VN-304</text>
      <line x1="125" y1="190" x2="220" y2="190" stroke="#B0BEC5" stroke-width="2"/>

      <text x="240" y="144" font-size="15" font-weight="900" fill="#37474F">Số ghế:</text>
      <text x="315" y="144" font-size="20" font-weight="900" fill="#E65100">12A</text>
      <line x1="305" y1="150" x2="430" y2="150" stroke="#B0BEC5" stroke-width="2"/>

      <!-- 6. CỔNG / GATE NỔI BẬT -->
      <g transform="translate(240, 160)">
        <rect x="0" y="0" width="190" height="70" rx="14" fill="#FFF3E0" stroke="#FF9800" stroke-width="3"/>
        <text x="95" y="24" font-size="12" font-weight="900" fill="#E65100" text-anchor="middle">CỔNG LÊN MÁY BAY / GATE</text>
        <text x="95" y="58" font-size="34" font-weight="900" fill="#D84315" text-anchor="middle">03</text>
      </g>

      <!-- 7. Thời gian bay & Ngày -->
      <text x="0" y="224" font-size="15" font-weight="900" fill="#37474F">Thời gian bay:</text>
      <text x="125" y="224" font-size="16" font-weight="900" fill="#37474F">08:30</text>
      <line x1="115" y1="230" x2="220" y2="230" stroke="#B0BEC5" stroke-width="2"/>
    </g>

    <!-- Dấu mộc ĐÃ KIỂM TRA ✓ to tròn -->
    <g id="pass-stamp-mark" class="stamp-group" transform="translate(500, 310) rotate(-15)" style="opacity: 0; transition: all 0.35s ease;">
      <rect x="-110" y="-35" width="220" height="70" rx="16" fill="rgba(232, 245, 233, 0.96)" stroke="#2E7D32" stroke-width="6"/>
      <text x="0" y="10" font-size="24" font-weight="900" fill="#1B5E20" text-anchor="middle">ĐÃ KIỂM TRA ✓</text>
    </g>
  </g>

  <!-- Bàn tay người cầm vé phía dưới góc trái -->
  <g transform="translate(30, 360)">
    <path d="M 0 100 Q 50 20 80 40 L 90 90 Q 90 180 30 240 Z" fill="#D7CCC8" stroke="#8D6E63" stroke-width="4"/>
    <ellipse cx="60" cy="70" rx="20" ry="35" transform="rotate(-25 60 70)" fill="#D7CCC8" stroke="#8D6E63" stroke-width="4"/>
  </g>
</svg>
