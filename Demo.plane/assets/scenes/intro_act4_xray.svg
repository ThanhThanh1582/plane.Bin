<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="secHall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="xrayScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00251A"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <linearGradient id="scannerCase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <filter id="xrayGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00E676" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Bối cảnh sảnh an ninh -->
  <rect width="800" height="320" fill="url(#secHall)"/>
  <rect y="320" width="800" height="130" fill="#90A4AE"/>

  <!-- Băng chuyền hành lý chạy ngang -->
  <rect x="50" y="270" width="700" height="70" rx="10" fill="#455A64" stroke="#263238" stroke-width="4"/>
  <!-- Các con lăn băng chuyền -->
  <circle cx="100" cy="305" r="18" fill="#37474F"/>
  <circle cx="160" cy="305" r="18" fill="#37474F"/>
  <circle cx="640" cy="305" r="18" fill="#37474F"/>
  <circle cx="700" cy="305" r="18" fill="#37474F"/>

  <!-- Thùng máy soi chiếu an ninh màu xám công nghệ cao ở giữa -->
  <rect x="220" y="80" width="360" height="260" rx="24" fill="url(#scannerCase)" stroke="#263238" stroke-width="6"/>
  <!-- Màn hình hiển thị X-Ray phía trên máy soi -->
  <rect x="250" y="100" width="300" height="170" rx="16" fill="url(#xrayScreen)" stroke="#00E676" stroke-width="4"/>

  <!-- Tia quét laser X-Ray phát sáng -->
  <line x1="260" y1="185" x2="540" y2="185" stroke="#00E676" stroke-width="3" stroke-dasharray="12 6"/>
  
  <!-- Hình ảnh 3 vật phẩm phát sáng X-Ray bên trong vali: Gấu bông, Quần áo, Mũ -->
  <g filter="url(#xrayGlow)">
    <!-- Gấu bông -->
    <g transform="translate(280, 140)">
      <circle cx="25" cy="25" r="22" fill="#00E676" opacity="0.5"/>
      <circle cx="12" cy="12" r="8" fill="#00E676" opacity="0.6"/>
      <circle cx="38" cy="12" r="8" fill="#00E676" opacity="0.6"/>
      <ellipse cx="25" cy="45" rx="22" ry="18" fill="#00E676" opacity="0.5"/>
    </g>
    <!-- Quần áo gấp gọn -->
    <rect x="365" y="150" width="70" height="60" rx="8" fill="#00E676" opacity="0.5" stroke="#00E676" stroke-width="2"/>
    <!-- Mũ nón -->
    <g transform="translate(460, 155)">
      <ellipse cx="30" cy="35" rx="30" ry="12" fill="#00E676" opacity="0.6"/>
      <path d="M 12 35 C 12 15, 48 15, 48 35 Z" fill="#00E676" opacity="0.5"/>
    </g>
  </g>

  <!-- Đèn tín hiệu an toàn xanh lá trên nóc máy -->
  <rect x="360" y="60" width="80" height="24" rx="6" fill="#00E676" stroke="#1B5E20" stroke-width="3"/>
  <text x="400" y="77" font-size="12" font-weight="900" fill="#1B5E20" text-anchor="middle">SAFE ✓</text>

  <!-- Vali đỏ của Bé Bin đang đi vào hầm máy soi bên trái -->
  <g transform="translate(100, 210) scale(0.65)">
    <rect x="20" y="20" width="120" height="150" rx="20" fill="#FF5252" stroke="#B71C1C" stroke-width="5"/>
    <circle cx="80" cy="90" r="24" fill="#FFFFFF"/>
    <circle cx="80" cy="90" r="18" fill="#8D6E63"/>
  </g>

  <text x="400" y="295" font-size="15" font-weight="900" fill="#00E676" text-anchor="middle">MÁY QUÉT AN NINH ĐANG SOI CHIẾU HÀNH LÝ</text>
</svg>
