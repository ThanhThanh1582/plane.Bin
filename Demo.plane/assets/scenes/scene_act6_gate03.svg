<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyConcourse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#E1F5FE"/>
    </linearGradient>
    <linearGradient id="floorConcourse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
  </defs>
  <!-- Cửa kính lớn nhìn ra sân đỗ máy bay -->
  <rect width="800" height="280" fill="url(#skyConcourse)"/>
  <!-- Máy bay đỗ ngoài đường băng -->
  <path d="M 120 180 L 260 180 L 300 200 L 140 200 Z" fill="#FFFFFF" stroke="#0288D1" stroke-width="4"/>
  <polygon points="120,180 90,130 140,180" fill="#0288D1"/>
  <rect y="280" width="800" height="170" fill="url(#floorConcourse)"/>

  <!-- Bảng điện tử chỉ dẫn cổng bay lớn treo trên trần -->
  <rect x="180" y="30" width="440" height="85" rx="16" fill="#263238" stroke="#37474F" stroke-width="6"/>
  
  <!-- Cổng 01 -->
  <rect x="200" y="45" width="90" height="55" rx="10" fill="#37474F"/>
  <text x="245" y="70" font-size="12" font-weight="900" fill="#B0BEC5" text-anchor="middle">GATE</text>
  <text x="245" y="92" font-size="20" font-weight="900" fill="#81D4FA" text-anchor="middle">01</text>
  
  <!-- Cổng 02 -->
  <rect x="305" y="45" width="90" height="55" rx="10" fill="#37474F"/>
  <text x="350" y="70" font-size="12" font-weight="900" fill="#B0BEC5" text-anchor="middle">GATE</text>
  <text x="350" y="92" font-size="20" font-weight="900" fill="#81D4FA" text-anchor="middle">02</text>

  <!-- Cổng 03 Nổi Bật -->
  <rect x="410" y="45" width="90" height="55" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="3"/>
  <text x="455" y="70" font-size="12" font-weight="900" fill="#E65100" text-anchor="middle">GATE</text>
  <text x="455" y="92" font-size="22" font-weight="900" fill="#E65100" text-anchor="middle">03</text>

  <!-- Cổng 05 -->
  <rect x="515" y="45" width="90" height="55" rx="10" fill="#37474F"/>
  <text x="560" y="70" font-size="12" font-weight="900" fill="#B0BEC5" text-anchor="middle">GATE</text>
  <text x="560" y="92" font-size="20" font-weight="900" fill="#81D4FA" text-anchor="middle">05</text>
</svg>
