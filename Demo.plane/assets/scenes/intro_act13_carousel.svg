<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hallWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="hallFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <linearGradient id="beltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1. SẢNH LẤY HÀNH LÝ SÂN BAY HIỆN ĐẠI -->
  <rect x="0" y="0" width="800" height="260" fill="url(#hallWall)"/>
  <rect x="0" y="260" width="800" height="190" fill="url(#hallFloor)"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#546E7A" stroke-width="4"/>

  <!-- Biển chỉ dẫn nhận hành lý "BAGGAGE CLAIM / TRẢ HÀNH LÝ" -->
  <g transform="translate(240, 20)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="60" rx="8" fill="#0D47A1" stroke="#FFD54F" stroke-width="3"/>
    <text x="160" y="26" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFD54F" text-anchor="middle" letter-spacing="1">TRẢ HÀNH LÝ • BAGGAGE CLAIM</text>
    <text x="160" y="48" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">BĂNG CHUYỀN SỐ 03 🧳</text>
  </g>

  <!-- Đèn chiếu sáng trần nhà sân bay -->
  <rect x="80" y="0" width="100" height="8" fill="#FFF59D"/>
  <rect x="620" y="0" width="100" height="8" fill="#FFF59D"/>

  <!-- 2. BĂNG CHUYỀN HÀNH LÝ LƯỢN OVAL HOÀNH TRÁNG -->
  <g transform="translate(100, 220)" filter="url(#shadow)">
    <!-- Đế kim loại của băng chuyền -->
    <ellipse cx="300" cy="110" rx="280" ry="80" fill="#78909C" stroke="#37474F" stroke-width="4"/>
    <!-- Vành đai băng tải cao su màu đen nhám -->
    <ellipse cx="300" cy="105" rx="250" ry="65" fill="url(#beltGrad)" stroke="#455A64" stroke-width="4"/>
    <!-- Lõi giữa băng chuyền mạ inox sáng bóng -->
    <ellipse cx="300" cy="105" rx="140" ry="35" fill="#B0BEC5" stroke="#90A4AE" stroke-width="3"/>
    <text x="300" y="112" font-family="sans-serif" font-size="13" font-weight="bold" fill="#37474F" text-anchor="middle">CAROUSEL 03</text>

    <!-- CÁC CHIẾC VALI ĐẦY MÀU SẮC ĐANG CHẠY TRÊN BĂNG CHUYỀN -->
    <!-- Vali 1: Vali Đỏ của Bé Bin (Có hình chú gấu nâu dễ thương) -->
    <g transform="translate(380, 50) rotate(15)">
      <rect x="0" y="0" width="70" height="48" rx="8" fill="#E53935" stroke="#B71C1C" stroke-width="2"/>
      <rect x="6" y="6" width="58" height="36" rx="4" fill="#EF5350"/>
      <!-- Hình chú gấu nâu trên thân vali -->
      <circle cx="35" cy="24" r="12" fill="#8D6E63"/>
      <circle cx="27" cy="16" r="4" fill="#8D6E63"/>
      <circle cx="43" cy="16" r="4" fill="#8D6E63"/>
      <ellipse cx="35" cy="27" rx="5" ry="3.5" fill="#D7CCC8"/>
      <!-- Thẻ hành lý màu vàng -->
      <rect x="64" y="20" width="12" height="7" fill="#FDD835" stroke="#F57F17" stroke-width="1"/>
    </g>

    <!-- Vali 2: Vali Xanh Dương tên lửa -->
    <g transform="translate(180, 70) rotate(-10)">
      <rect x="0" y="0" width="65" height="45" rx="8" fill="#1E88E5" stroke="#0D47A1" stroke-width="2"/>
      <polygon points="32,12 42,32 22,32" fill="#FFF59D"/>
    </g>

    <!-- Vali 3: Vali Xanh Lá quả bóng -->
    <g transform="translate(80, 100) rotate(20)">
      <rect x="0" y="0" width="60" height="42" rx="7" fill="#43A047" stroke="#1B5E20" stroke-width="2"/>
      <circle cx="30" cy="21" r="10" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 3. BÉ BIN ĐỨNG HÁO HỨC NHÌN BĂNG CHUYỀN -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <!-- Chân & Giày -->
    <rect x="35" y="180" width="16" height="50" rx="6" fill="#FCD0B4"/>
    <rect x="65" y="180" width="16" height="50" rx="6" fill="#FCD0B4"/>
    <rect x="28" y="222" width="28" height="14" rx="5" fill="#0288D1" stroke="#01579B" stroke-width="2"/>
    <rect x="62" y="222" width="28" height="14" rx="5" fill="#0288D1" stroke="#01579B" stroke-width="2"/>

    <!-- Quần thun xanh -->
    <path d="M 28 135 L 88 135 L 85 185 L 62 185 L 58 150 L 54 185 L 31 185 Z" fill="#4FC3F7" stroke="#0288D1" stroke-width="3"/>

    <!-- Áo thun vàng in hình máy bay -->
    <path d="M 20 65 Q 58 55 96 65 L 90 142 Q 58 148 26 142 Z" fill="#FDD835" stroke="#F57F17" stroke-width="3"/>
    <g transform="translate(56, 85) rotate(-10) scale(0.45)">
      <polygon points="10,40 55,10 70,55 35,45" fill="none" stroke="#F57F17" stroke-width="3"/>
    </g>

    <!-- Tay phải chỉ về phía vali đỏ trên băng chuyền -->
    <path d="M 94 68 L 135 75 Q 145 80 140 90 L 92 88 Z" fill="#FCD0B4" stroke="#FFA726" stroke-width="2"/>
    <circle cx="140" cy="82" r="8" fill="#FCD0B4"/>
    <path d="M 22 68 L 5 100 Q -5 110 5 115 L 18 85 Z" fill="#FCD0B4" stroke="#FFA726" stroke-width="2"/>
    <circle cx="2" cy="110" r="8" fill="#FCD0B4"/>

    <!-- Đầu & Khuôn mặt vui sướng -->
    <ellipse cx="58" cy="25" rx="36" ry="33" fill="#FCD0B4" stroke="#FFA726" stroke-width="2"/>
    <path d="M 24 20 C 24 -20, 92 -20, 92 20 C 88 0, 75 -10, 65 -5 C 55 -15, 45 -10, 38 0 C 30 0, 26 10, 24 20 Z" fill="#4E342E"/>
    <path d="M 68 -15 Q 75 -35 70 -38 Q 62 -30 64 -15 Z" fill="#4E342E"/>

    <!-- Mắt to cười tít mắt hạnh phúc -->
    <ellipse cx="44" cy="20" rx="5" ry="6" fill="#212121"/>
    <circle cx="42" cy="18" r="2" fill="#FFFFFF"/>
    <ellipse cx="72" cy="20" rx="5" ry="6" fill="#212121"/>
    <circle cx="70" cy="18" r="2" fill="#FFFFFF"/>
    <ellipse cx="34" cy="28" rx="8" ry="5" fill="#FF8A80" opacity="0.6"/>
    <ellipse cx="82" cy="28" rx="8" ry="5" fill="#FF8A80" opacity="0.6"/>
    <path d="M 48 30 Q 58 44 68 30" stroke="#BF360C" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
