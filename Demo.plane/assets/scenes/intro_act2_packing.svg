<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#BCAAA4"/>
    </linearGradient>
    <linearGradient id="rugGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80CBC4"/>
      <stop offset="100%" stop-color="#4DB6AC"/>
    </linearGradient>
    <linearGradient id="suitcaseRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 1. PHÒNG KHÁCH / PHÒNG XẾP ĐỒ ẤM ÁP -->
  <rect x="0" y="0" width="800" height="300" fill="url(#wallGrad)"/>
  <rect x="0" y="300" width="800" height="150" fill="url(#floorGrad)"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#8D6E63" stroke-width="4"/>

  <!-- Tranh treo tường gia đình đi du lịch -->
  <g transform="translate(100, 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="#8D6E63"/>
    <rect x="6" y="6" width="118" height="78" rx="4" fill="#E1F5FE"/>
    <circle cx="100" cy="25" r="14" fill="#FFE082"/>
    <path d="M 20 70 C 40 45, 60 45, 80 70 Z" fill="#81C784"/>
    <path d="M 60 70 C 80 50, 100 50, 120 70 Z" fill="#66BB6A"/>
    <!-- Máy bay nhỏ xíu trên bầu trời trong tranh -->
    <path d="M 30 25 L 45 22 L 40 28 Z" fill="#0288D1"/>
  </g>

  <!-- Cửa sổ nhìn ra vườn cây xanh ngập tràn ánh sáng -->
  <g transform="translate(560, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#8D6E63" stroke-width="4"/>
    <rect x="8" y="8" width="144" height="134" fill="#E0F7FA"/>
    <circle cx="120" cy="40" r="22" fill="#FFF59D"/>
    <!-- Cây xanh bên ngoài -->
    <circle cx="50" cy="120" r="40" fill="#A5D6A7"/>
    <circle cx="100" cy="110" r="35" fill="#81C784"/>
    <line x1="80" y1="8" x2="80" y2="142" stroke="#8D6E63" stroke-width="3"/>
    <line x1="8" y1="75" x2="152" y2="75" stroke="#8D6E63" stroke-width="3"/>
  </g>

  <!-- Thảm len tròn màu ngọc bích êm ái -->
  <ellipse cx="400" cy="385" rx="340" ry="55" fill="url(#rugGrad)" filter="url(#shadow)"/>

  <!-- 2. CHIẾC VALI ĐỎ MỞ CÁNH TRÊN THẢM -->
  <g transform="translate(180, 270)" filter="url(#shadow)">
    <!-- Đáy vali mở nằm ngang -->
    <rect x="0" y="30" width="220" height="90" rx="14" fill="url(#suitcaseRed)" stroke="#B71C1C" stroke-width="3"/>
    <!-- Lòng trong của vali (vải lót xám chấm bi êm ái) -->
    <rect x="10" y="38" width="200" height="74" rx="8" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>
    <!-- Nắp vali dựng đứng phía sau -->
    <path d="M 10 30 L 20 -20 Q 25 -30 40 -30 L 180 -30 Q 195 -30 200 -20 L 210 30 Z" fill="#E53935" stroke="#B71C1C" stroke-width="3"/>
    <!-- Tay cầm & Bánh xe xoay 360 độ -->
    <rect x="90" y="118" width="40" height="8" rx="4" fill="#424242"/>
    <circle cx="30" cy="124" r="8" fill="#212121"/>
    <circle cx="190" cy="124" r="8" fill="#212121"/>
    <!-- Đồ vật mẫu đã xếp gọn trong vali: Chú gấu bông nhỏ xinh & áo thun vàng -->
    <g transform="translate(30, 48) scale(0.6)">
      <!-- Gấu bông -->
      <circle cx="30" cy="30" r="22" fill="#8D6E63"/>
      <circle cx="16" cy="14" r="9" fill="#8D6E63"/>
      <circle cx="44" cy="14" r="9" fill="#8D6E63"/>
      <ellipse cx="30" cy="36" rx="10" ry="7" fill="#D7CCC8"/>
      <circle cx="30" cy="33" r="3" fill="#3E2723"/>
      <circle cx="23" cy="26" r="3" fill="#212121"/>
      <circle cx="37" cy="26" r="3" fill="#212121"/>
    </g>
    <g transform="translate(100, 52) scale(0.55)">
      <!-- Áo thun gấp gọn -->
      <rect x="0" y="0" width="70" height="55" rx="6" fill="#FDD835" stroke="#F57F17" stroke-width="2"/>
      <polygon points="20,35 45,15 55,40 30,32" fill="none" stroke="#F57F17" stroke-width="2"/>
    </g>
  </g>

  <!-- 3. BÉ BIN VÀ BỐ ĐANG CHUẨN BỊ ĐỒ -->
  <!-- Bé Bin đứng háo hức bên cạnh vali -->
  <g transform="translate(450, 170)" filter="url(#shadow)">
    <!-- Chân & Giày -->
    <rect x="35" y="180" width="16" height="50" rx="6" fill="#FCD0B4"/>
    <rect x="65" y="180" width="16" height="50" rx="6" fill="#FCD0B4"/>
    <!-- Giày xanh dán xé -->
    <rect x="28" y="222" width="28" height="14" rx="5" fill="#0288D1" stroke="#01579B" stroke-width="2"/>
    <rect x="62" y="222" width="28" height="14" rx="5" fill="#0288D1" stroke="#01579B" stroke-width="2"/>

    <!-- Quần thun xanh -->
    <path d="M 28 135 L 88 135 L 85 185 L 62 185 L 58 150 L 54 185 L 31 185 Z" fill="#4FC3F7" stroke="#0288D1" stroke-width="3"/>

    <!-- Áo thun vàng in hình máy bay -->
    <path d="M 20 65 Q 58 55 96 65 L 90 142 Q 58 148 26 142 Z" fill="#FDD835" stroke="#F57F17" stroke-width="3"/>
    <g transform="translate(56, 85) rotate(-10) scale(0.45)">
      <polygon points="10,40 55,10 70,55 35,45" fill="none" stroke="#F57F17" stroke-width="3"/>
    </g>

    <!-- Tay trái chỉ vào vali, tay phải xòe tự tin -->
    <path d="M 22 68 L -5 105 Q -10 115 2 118 L 18 85 Z" fill="#FCD0B4" stroke="#FFA726" stroke-width="2"/>
    <circle cx="-5" cy="115" r="8" fill="#FCD0B4"/>
    <path d="M 94 68 L 115 105 Q 125 115 118 120 L 92 85 Z" fill="#FCD0B4" stroke="#FFA726" stroke-width="2"/>
    <circle cx="120" cy="115" r="8" fill="#FCD0B4"/>

    <!-- Đầu & Khuôn mặt Bé Bin -->
    <ellipse cx="58" cy="25" rx="36" ry="33" fill="#FCD0B4" stroke="#FFA726" stroke-width="2"/>
    <!-- Mái tóc đen có lọn tóc cong -->
    <path d="M 24 20 C 24 -20, 92 -20, 92 20 C 88 0, 75 -10, 65 -5 C 55 -15, 45 -10, 38 0 C 30 0, 26 10, 24 20 Z" fill="#4E342E"/>
    <path d="M 68 -15 Q 75 -35 70 -38 Q 62 -30 64 -15 Z" fill="#4E342E"/>
    <!-- Mắt to long lanh & Má hồng -->
    <ellipse cx="44" cy="20" rx="5" ry="6" fill="#212121"/>
    <circle cx="42" cy="18" r="2" fill="#FFFFFF"/>
    <ellipse cx="72" cy="20" rx="5" ry="6" fill="#212121"/>
    <circle cx="70" cy="18" r="2" fill="#FFFFFF"/>
    <ellipse cx="34" cy="28" rx="8" ry="5" fill="#FF8A80" opacity="0.6"/>
    <ellipse cx="82" cy="28" rx="8" ry="5" fill="#FF8A80" opacity="0.6"/>
    <path d="M 50 32 Q 58 42 66 32" stroke="#BF360C" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
