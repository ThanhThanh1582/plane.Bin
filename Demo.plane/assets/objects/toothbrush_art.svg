<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="brushGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)" transform="rotate(45 150 150)">
    <!-- Cán bàn chải -->
    <rect x="138" y="70" width="24" height="170" rx="12" fill="url(#brushGrad)" stroke="#1B5E20" stroke-width="4"/>
    <ellipse cx="150" cy="220" rx="6" ry="10" fill="#E8F5E9"/>
    <!-- Lông bàn chải -->
    <rect x="134" y="45" width="32" height="30" rx="6" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="3"/>
    <line x1="142" y1="48" x2="142" y2="72" stroke="#29B6F6" stroke-width="3"/>
    <line x1="150" y1="48" x2="150" y2="72" stroke="#29B6F6" stroke-width="3"/>
    <line x1="158" y1="48" x2="158" y2="72" stroke="#29B6F6" stroke-width="3"/>
  </g>
</svg>
