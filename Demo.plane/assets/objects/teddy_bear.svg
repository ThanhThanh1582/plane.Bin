<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Tai gấu -->
    <circle cx="95" cy="85" r="30" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
    <circle cx="95" cy="85" r="16" fill="#D7CCC8"/>
    <circle cx="205" cy="85" r="30" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
    <circle cx="205" cy="85" r="16" fill="#D7CCC8"/>
    
    <!-- Thân gấu ôm -->
    <ellipse cx="150" cy="200" rx="65" ry="60" fill="url(#bearGrad)" stroke="#5D4037" stroke-width="5"/>
    
    <!-- Đầu gấu -->
    <circle cx="150" cy="120" r="55" fill="url(#bearGrad)" stroke="#5D4037" stroke-width="5"/>
    <ellipse cx="150" cy="135" rx="28" ry="20" fill="#EFEBE9"/>
    <!-- Mũi & miệng -->
    <ellipse cx="150" cy="128" rx="8" ry="6" fill="#3E2723"/>
    <path d="M 150 134 L 150 144 M 144 142 Q 150 148 156 142" stroke="#3E2723" stroke-width="3" fill="none"/>
    <!-- Mắt tròn -->
    <circle cx="130" cy="112" r="6" fill="#212121"/>
    <circle cx="170" cy="112" r="6" fill="#212121"/>
    <!-- Má hồng -->
    <circle cx="115" cy="128" r="8" fill="#FFAB91" opacity="0.6"/>
    <circle cx="185" cy="128" r="8" fill="#FFAB91" opacity="0.6"/>
    
    <!-- Chân tay tròn -->
    <ellipse cx="90" cy="190" rx="18" ry="28" transform="rotate(30 90 190)" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
    <ellipse cx="210" cy="190" rx="18" ry="28" transform="rotate(-30 210 190)" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
    <ellipse cx="110" cy="250" rx="20" ry="28" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
    <ellipse cx="190" cy="250" rx="20" ry="28" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
  </g>
</svg>
