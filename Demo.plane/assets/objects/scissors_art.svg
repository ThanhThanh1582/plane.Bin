<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Lưỡi kéo kim loại nhọn cảnh báo -->
    <path d="M 120 70 L 150 160 L 140 160 L 90 90 Z" fill="#CFD8DC" stroke="#78909C" stroke-width="4"/>
    <path d="M 180 70 L 150 160 L 160 160 L 210 90 Z" fill="#ECEFF1" stroke="#78909C" stroke-width="4"/>
    <circle cx="150" cy="160" r="7" fill="#37474F"/>
    <!-- Tay cầm kéo màu đỏ -->
    <ellipse cx="110" cy="220" rx="35" ry="30" fill="none" stroke="#E53935" stroke-width="14"/>
    <ellipse cx="190" cy="220" rx="35" ry="30" fill="none" stroke="#E53935" stroke-width="14"/>
    <!-- Biểu tượng cảnh báo nhỏ -->
    <circle cx="230" cy="80" r="22" fill="#FFE082" stroke="#FF9800" stroke-width="3"/>
    <text x="230" y="88" font-size="22" font-weight="900" fill="#E65100" text-anchor="middle">!</text>
  </g>
</svg>
