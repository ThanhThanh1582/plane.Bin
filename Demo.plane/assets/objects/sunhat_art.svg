<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Vành nón rộng -->
    <ellipse cx="150" cy="180" rx="110" ry="38" fill="url(#hatGrad)" stroke="#FFA000" stroke-width="5"/>
    <!-- Chóp nón cói -->
    <path d="M 95 170 C 95 90, 205 90, 205 170 Z" fill="url(#hatGrad)" stroke="#FFA000" stroke-width="5"/>
    <!-- Dải ruy băng xanh mát -->
    <path d="M 95 160 Q 150 178 205 160 L 205 170 Q 150 188 95 170 Z" fill="#29B6F6"/>
  </g>
</svg>
