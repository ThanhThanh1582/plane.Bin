<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4D2"/>
      <stop offset="100%" stop-color="#FCD0B4"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1B18"/>
    </linearGradient>
    <linearGradient id="shirtY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FDD835"/>
    </linearGradient>
    <linearGradient id="shortsB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Đôi chân & Tất mộc trắng -->
    <path d="M 205 490 L 205 575 Q 205 585 215 585 L 225 585 Q 235 585 235 575 L 235 490 Z" fill="url(#skin)"/>
    <path d="M 265 490 L 265 575 Q 265 585 275 585 L 285 585 Q 295 585 295 575 L 295 490 Z" fill="url(#skin)"/>
    <circle cx="220" cy="520" r="10" fill="#FF8A80" opacity="0.4"/>
    <circle cx="280" cy="520" r="10" fill="#FF8A80" opacity="0.4"/>

    <ellipse cx="220" cy="580" rx="20" ry="12" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>
    <ellipse cx="280" cy="580" rx="20" ry="12" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>

    <!-- Quần short thun xanh dương -->
    <path d="M 185 390 L 315 390 L 310 495 L 260 495 L 250 435 L 240 495 L 190 495 Z" fill="url(#shortsB)" stroke="#0288D1" stroke-width="4"/>
    <path d="M 195 405 Q 215 420 210 445" stroke="#0288D1" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 305 405 Q 285 420 290 445" stroke="#0288D1" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Áo thun vàng với hình máy bay giấy -->
    <path d="M 170 270 Q 250 255 330 270 L 320 405 Q 250 415 180 405 Z" fill="url(#shirtY)" stroke="#F57F17" stroke-width="4"/>
    <path d="M 180 400 Q 250 410 320 400" stroke="#F57F17" stroke-width="3" fill="none"/>
    <path d="M 218 262 Q 250 285 282 262" stroke="#F57F17" stroke-width="4" fill="none" stroke-linecap="round"/>

    <g transform="translate(260, 310) rotate(-10) scale(0.65)">
      <polygon points="10,40 55,10 70,55 35,45" fill="none" stroke="#F57F17" stroke-width="4" stroke-linejoin="round"/>
      <line x1="55" y1="10" x2="35" y2="45" stroke="#F57F17" stroke-width="4"/>
    </g>

    <!-- Cánh tay áo vàng cộc tay -->
    <g transform="translate(135, 270)">
      <path d="M 40 5 L 10 45 L 35 55 L 55 15 Z" fill="url(#shirtY)" stroke="#F57F17" stroke-width="4"/>
      <path d="M 16 48 Q 10 90 20 130 Q 30 145 42 135 Q 45 95 32 52 Z" fill="url(#skin)" stroke="#FFA726" stroke-width="3"/>
      <circle cx="28" cy="140" r="14" fill="url(#skin)"/>
      <circle cx="18" cy="135" r="5" fill="url(#skin)"/>
    </g>

    <g transform="translate(315, 270)">
      <path d="M 10 5 L 40 45 L 15 55 L -5 15 Z" fill="url(#shirtY)" stroke="#F57F17" stroke-width="4"/>
      <path d="M 34 48 Q 40 90 30 130 Q 20 145 8 135 Q 5 95 18 52 Z" fill="url(#skin)" stroke="#FFA726" stroke-width="3"/>
      <circle cx="22" cy="140" r="14" fill="url(#skin)"/>
      <circle cx="32" cy="135" r="5" fill="url(#skin)"/>
    </g>

    <!-- Cổ & Khuôn mặt -->
    <rect x="235" y="245" width="30" height="25" fill="url(#skin)"/>

    <ellipse cx="250" cy="180" rx="72" ry="65" fill="url(#skin)" stroke="#FFA726" stroke-width="3"/>

    <circle cx="178" cy="185" r="16" fill="url(#skin)" stroke="#FFA726" stroke-width="3"/>
    <circle cx="178" cy="185" r="8" fill="#F8BBD0" opacity="0.6"/>
    <circle cx="322" cy="185" r="16" fill="url(#skin)" stroke="#FFA726" stroke-width="3"/>
    <circle cx="322" cy="185" r="8" fill="#F8BBD0" opacity="0.6"/>

    <path d="M 176 170 C 176 90, 324 90, 324 170 C 315 135, 290 120, 270 130 C 255 115, 235 115, 220 130 C 205 120, 185 135, 176 170 Z" fill="url(#hair)"/>
    <path d="M 270 100 Q 285 65 275 60 Q 260 70 262 100 Z" fill="url(#hair)"/>

    <path d="M 205 145 Q 220 140 230 147" stroke="#4E342E" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 295 145 Q 280 140 270 147" stroke="#4E342E" stroke-width="4" stroke-linecap="round" fill="none"/>

    <ellipse cx="218" cy="170" rx="9" ry="11" fill="#212121"/>
    <circle cx="215" cy="166" r="3.5" fill="#FFFFFF"/>
    <circle cx="221" cy="174" r="1.5" fill="#FFFFFF"/>

    <ellipse cx="282" cy="170" rx="9" ry="11" fill="#212121"/>
    <circle cx="279" cy="166" r="3.5" fill="#FFFFFF"/>
    <circle cx="285" cy="174" r="1.5" fill="#FFFFFF"/>

    <circle cx="250" cy="182" r="2.5" fill="#D84315"/>

    <ellipse cx="195" cy="188" rx="14" ry="9" fill="#FF8A80" opacity="0.65"/>
    <ellipse cx="305" cy="188" rx="14" ry="9" fill="#FF8A80" opacity="0.65"/>

    <path d="M 232 195 Q 250 212 268 195" stroke="#BF360C" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
