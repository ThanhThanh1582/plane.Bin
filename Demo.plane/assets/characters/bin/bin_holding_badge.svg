<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skinGradB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="shirtGradB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FDD835"/>
    </linearGradient>
    <linearGradient id="goldMedal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="50%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="toyShadowB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#toyShadowB)">
    <!-- Đôi chân & Giày dán xé -->
    <rect x="135" y="440" width="40" height="70" rx="20" fill="url(#skinGradB)"/>
    <rect x="225" y="440" width="40" height="70" rx="20" fill="url(#skinGradB)"/>
    <ellipse cx="145" cy="540" rx="36" ry="18" fill="#0288D1"/>
    <ellipse cx="255" cy="540" rx="36" ry="18" fill="#0288D1"/>

    <!-- Quần short thun xanh -->
    <path d="M 120 360 L 280 360 L 270 450 L 210 450 L 200 400 L 190 450 L 130 450 Z" fill="#42A5F5" stroke="#1976D2" stroke-width="4"/>

    <!-- Áo thun vàng -->
    <path d="M 110 220 L 290 220 L 295 375 L 105 375 Z" fill="url(#shirtGradB)" stroke="#F57F17" stroke-width="5" rx="20"/>

    <!-- Huy hiệu vàng cầm trước ngực -->
    <circle cx="200" cy="300" r="48" fill="url(#goldMedal)" stroke="#E65100" stroke-width="5"/>
    <polygon points="200,265 210,290 235,290 215,305 222,330 200,315 178,330 185,305 165,290 190,290" fill="#FFFFFF"/>

    <!-- Tay giơ huy hiệu -->
    <rect x="90" y="240" width="40" height="70" rx="16" transform="rotate(35 90 240)" fill="url(#skinGradB)" stroke="#FFA726" stroke-width="3"/>
    <rect x="270" y="240" width="40" height="70" rx="16" transform="rotate(-35 270 240)" fill="url(#skinGradB)" stroke="#FFA726" stroke-width="3"/>

    <!-- Đầu & nụ cười tươi -->
    <circle cx="200" cy="130" r="85" fill="url(#skinGradB)" stroke="#FFA726" stroke-width="4"/>
    <path d="M 115 110 C 115 40, 285 40, 285 110 C 275 85, 230 75, 200 90 C 170 75, 125 85, 115 110 Z" fill="#212121"/>
    <path d="M 200 45 Q 215 25 210 20 Q 200 25 200 45" fill="#212121"/>
    
    <circle cx="165" cy="125" r="10" fill="#212121"/>
    <circle cx="162" cy="122" r="3" fill="#FFFFFF"/>
    <circle cx="235" cy="125" r="10" fill="#212121"/>
    <circle cx="232" cy="122" r="3" fill="#FFFFFF"/>
    <circle cx="145" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="255" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>

    <path d="M 175 145 Q 200 175 225 145" stroke="#BF360C" stroke-width="6" stroke-linecap="round" fill="#D32F2F"/>
  </g>
</svg>
