<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="beltGradFast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#455A64"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="buckleChromeFast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <filter id="buckleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00E676" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dây An Toàn ĐÃ CÀI CHẮC CHẮN (Layer Trong Suốt) -->
  <g id="layer-seatbelt-fastened" filter="url(#buckleGlow)">
    <!-- Bản dây thắt ngang qua hông/bụng -->
    <rect x="70" y="340" width="260" height="42" rx="12" fill="url(#beltGradFast)" stroke="#1A237E" stroke-width="4"/>
    <line x1="80" y1="350" x2="320" y2="350" stroke="#78909C" stroke-width="2" stroke-dasharray="8 4"/>
    <line x1="80" y1="372" x2="320" y2="372" stroke="#78909C" stroke-width="2" stroke-dasharray="8 4"/>
    
    <!-- Khóa kim loại trung tâm sáng bóng -->
    <rect x="165" y="330" width="70" height="62" rx="12" fill="url(#buckleChromeFast)" stroke="#37474F" stroke-width="4"/>
    <circle cx="200" cy="361" r="16" fill="#00E676" stroke="#00897B" stroke-width="3"/>
    <!-- Dấu tích an toàn ✓ -->
    <path d="M 193 361 L 198 366 L 208 355" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
