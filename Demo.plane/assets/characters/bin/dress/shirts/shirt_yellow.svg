<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowHoodieL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FDD835"/>
    </linearGradient>
  </defs>

  <!-- Áo Hoodie Vàng (Layer Trong Suốt) -->
  <g id="layer-shirt-yellow">
    <!-- Thân áo hoodie -->
    <rect x="110" y="220" width="180" height="155" rx="36" fill="url(#yellowHoodieL)" stroke="#F57F17" stroke-width="5"/>
    <!-- Túi kangaroo trước bụng -->
    <path d="M 140 305 Q 200 325 260 305 L 250 355 L 150 355 Z" fill="#FFF9C4" stroke="#FBC02D" stroke-width="3"/>
    <!-- Dây rút mũ hoodie -->
    <path d="M 175 225 Q 170 260 175 275" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 225 225 Q 230 260 225 275" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Ống tay áo hoodie -->
    <rect x="70" y="240" width="44" height="90" rx="22" transform="rotate(15 70 240)" fill="url(#yellowHoodieL)" stroke="#F57F17" stroke-width="4"/>
    <rect x="285" y="240" width="44" height="90" rx="22" transform="rotate(-15 285 240)" fill="url(#yellowHoodieL)" stroke="#F57F17" stroke-width="4"/>
  </g>
</svg>
