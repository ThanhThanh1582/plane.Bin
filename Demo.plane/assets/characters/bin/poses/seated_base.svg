<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skinS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <filter id="shadowS" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#shadowS)">
    <!-- Đùi và Đầu gối ngồi -->
    <rect x="120" y="380" width="60" height="90" rx="20" fill="var(--bin-pants-color, #1E88E5)"/>
    <rect x="220" y="380" width="60" height="90" rx="20" fill="var(--bin-pants-color, #1E88E5)"/>
    
    <!-- Cẳng chân thõng xuống -->
    <rect x="132" y="440" width="36" height="70" rx="18" fill="url(#skinS)"/>
    <rect x="232" y="440" width="36" height="70" rx="18" fill="url(#skinS)"/>
    
    <!-- Giày ngồi -->
    <ellipse cx="150" cy="515" rx="30" ry="18" fill="var(--bin-shoes-color, #1976D2)"/>
    <ellipse cx="250" cy="515" rx="30" ry="18" fill="var(--bin-shoes-color, #1976D2)"/>

    <!-- Thân áo ngồi -->
    <rect x="110" y="230" width="180" height="170" rx="36" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="4"/>

    <!-- Tay đặt ngoan trên đùi -->
    <rect x="75" y="250" width="42" height="110" rx="21" transform="rotate(18 75 250)" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="3"/>
    <circle cx="95" cy="370" r="18" fill="url(#skinS)"/>

    <rect x="285" y="250" width="42" height="110" rx="21" transform="rotate(-18 285 250)" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="3"/>
    <circle cx="305" cy="370" r="18" fill="url(#skinS)"/>

    <!-- Đầu & Mặt Bé Bin -->
    <circle cx="200" cy="135" r="85" fill="url(#skinS)" stroke="#FFA726" stroke-width="4"/>
    <circle cx="115" cy="140" r="18" fill="url(#skinS)"/>
    <circle cx="285" cy="140" r="18" fill="url(#skinS)"/>
    
    <!-- Tóc nâu đen -->
    <path d="M 115 115 C 115 45, 285 45, 285 115 C 275 90, 230 80, 200 95 C 170 80, 125 90, 115 115 Z" fill="#3E2723"/>
    <path d="M 195 55 Q 210 25 225 40 Q 215 55 205 60 Z" fill="#3E2723"/>
    
    <!-- Mắt tròn -->
    <circle cx="165" cy="130" r="10" fill="#212121"/>
    <circle cx="162" cy="127" r="3" fill="#FFFFFF"/>
    <circle cx="235" cy="130" r="10" fill="#212121"/>
    <circle cx="232" cy="127" r="3" fill="#FFFFFF"/>

    <!-- Má hồng -->
    <circle cx="145" cy="150" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="255" cy="150" r="14" fill="#FF8A80" opacity="0.6"/>

    <!-- Miệng cười tươi -->
    <path d="M 180 150 Q 200 175 220 150" stroke="#BF360C" stroke-width="5" stroke-linecap="round" fill="#D32F2F"/>
  </g>
</svg>
