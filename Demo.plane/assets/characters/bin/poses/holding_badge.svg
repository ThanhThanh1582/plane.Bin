<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skinHB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FFD54F" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g id="pose-holding-badge">
    <!-- Đôi chân đứng nhảy ăn mừng -->
    <rect x="135" y="440" width="38" height="90" rx="19" fill="url(#skinHB)"/>
    <rect x="227" y="440" width="38" height="90" rx="19" fill="url(#skinHB)"/>
    <ellipse cx="145" cy="535" rx="34" ry="20" fill="var(--bin-shoes-color, #1976D2)"/>
    <ellipse cx="255" cy="535" rx="34" ry="20" fill="var(--bin-shoes-color, #1976D2)"/>

    <!-- Quần -->
    <path d="M 120 360 L 280 360 L 270 450 L 210 450 L 200 400 L 190 450 L 130 450 Z" fill="var(--bin-pants-color, #1E88E5)" stroke="#0D47A1" stroke-width="4"/>

    <!-- Áo -->
    <rect x="110" y="220" width="180" height="155" rx="36" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="5"/>

    <!-- Cánh tay nâng cao mô hình máy bay vàng nhận thưởng -->
    <rect x="80" y="200" width="40" height="100" rx="20" transform="rotate(-30 80 200)" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="3"/>
    <rect x="280" y="200" width="40" height="100" rx="20" transform="rotate(30 280 200)" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="3"/>
    <circle cx="120" cy="180" r="16" fill="url(#skinHB)"/>
    <circle cx="280" cy="180" r="16" fill="url(#skinHB)"/>

    <!-- Mô Hình Máy Bay Vàng Óng Ánh & Huy Hiệu -->
    <g transform="translate(140, 130) scale(1.2)" filter="url(#goldGlow)">
      <!-- Thân máy bay đồ chơi vàng -->
      <path d="M 0 30 Q 50 15 100 30 Q 80 45 0 30 Z" fill="url(#goldTrophy)" stroke="#E65100" stroke-width="3"/>
      <!-- Cánh máy bay -->
      <polygon points="40,20 60,0 70,22" fill="url(#goldTrophy)" stroke="#E65100" stroke-width="2"/>
      <polygon points="40,35 60,55 70,33" fill="url(#goldTrophy)" stroke="#E65100" stroke-width="2"/>
      <!-- Đuôi máy bay -->
      <polygon points="10,24 0,8 18,24" fill="url(#goldTrophy)" stroke="#E65100" stroke-width="2"/>
      <circle cx="50" cy="28" r="14" fill="#E8F5E9" stroke="#00E676" stroke-width="2"/>
      <text x="44" y="33" font-size="14" font-weight="bold" fill="#00796B">★</text>
    </g>

    <!-- Đầu & Mặt Bé Bin Hân Hoan Tột Đỉnh -->
    <circle cx="200" cy="130" r="85" fill="url(#skinHB)" stroke="#FFA726" stroke-width="4"/>
    <circle cx="115" cy="135" r="18" fill="url(#skinHB)"/>
    <circle cx="285" cy="135" r="18" fill="url(#skinHB)"/>
    
    <!-- Tóc nâu đen -->
    <path d="M 115 110 C 115 40, 285 40, 285 110 C 275 85, 230 75, 200 90 C 170 75, 125 85, 115 110 Z" fill="#3E2723"/>
    <path d="M 195 50 Q 210 20 225 35 Q 215 50 205 55 Z" fill="#3E2723"/>
    
    <!-- Mắt cười tít vui vẻ -->
    <path d="M 155 125 Q 165 115 175 125" stroke="#212121" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 225 125 Q 235 115 245 125" stroke="#212121" stroke-width="4" fill="none" stroke-linecap="round"/>

    <circle cx="145" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="255" cy="145" r="14" fill="#FF8A80" opacity="0.6"/>

    <!-- Miệng cười to hạnh phúc -->
    <path d="M 175 145 Q 200 180 225 145 Z" fill="#D32F2F" stroke="#BF360C" stroke-width="4"/>
  </g>
</svg>
