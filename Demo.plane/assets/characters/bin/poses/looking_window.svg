<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skinW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
  </defs>

  <g id="pose-looking-window">
    <!-- Đùi ngồi nghiêng sang phải -->
    <rect x="150" y="380" width="120" height="70" rx="20" fill="var(--bin-pants-color, #1E88E5)"/>
    <rect x="230" y="430" width="36" height="70" rx="18" fill="url(#skinW)"/>
    <ellipse cx="250" cy="510" rx="30" ry="18" fill="var(--bin-shoes-color, #1976D2)"/>

    <!-- Thân áo ngồi nghiêng -->
    <rect x="130" y="230" width="160" height="170" rx="36" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="4"/>

    <!-- Cánh tay giơ lên chỉ/chạm vào cửa sổ ngắm mây -->
    <rect x="230" y="220" width="38" height="110" rx="19" transform="rotate(-55 230 220)" fill="var(--bin-shirt-color, #FDD835)" stroke="#F57F17" stroke-width="3"/>
    <circle cx="330" cy="180" r="18" fill="url(#skinW)"/>

    <!-- Đầu & Mặt Bé Bin (Nghiêng nhìn về bên phải) -->
    <circle cx="230" cy="135" r="85" fill="url(#skinW)" stroke="#FFA726" stroke-width="4"/>
    <circle cx="150" cy="140" r="18" fill="url(#skinW)"/>
    
    <!-- Tóc nâu đen nghiêng -->
    <path d="M 150 115 C 150 45, 310 45, 310 115 C 300 90, 260 80, 230 95 C 200 80, 160 90, 150 115 Z" fill="#3E2723"/>
    <path d="M 235 55 Q 260 25 275 40 Q 265 55 255 60 Z" fill="#3E2723"/>
    
    <!-- Mắt tròn to nhìn thích thú về phía cửa sổ -->
    <circle cx="270" cy="130" r="11" fill="#212121"/>
    <circle cx="273" cy="127" r="4" fill="#FFFFFF"/>
    <circle cx="280" cy="150" r="14" fill="#FF8A80" opacity="0.6"/>

    <!-- Miệng cười chữ O ngạc nhiên thích thú -->
    <ellipse cx="280" cy="155" rx="12" ry="16" fill="#D32F2F" stroke="#BF360C" stroke-width="3"/>
  </g>
</svg>
